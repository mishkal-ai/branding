name: Brand kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede only this PR's older run; main runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brand-kit:
    name: brand-kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/brand_distribution.py generate --check
      - run: python3 scripts/brand_distribution.py check-source
      - run: python3 -m unittest discover -s tests -v
