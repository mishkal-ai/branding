name: Brand kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand-kit:
    name: brand-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/brand_distribution.py generate --check
      - run: python3 scripts/brand_distribution.py check-source
      - run: python3 -m unittest discover -s tests -v
